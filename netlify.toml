# Netlify config for the Next.js migration of jmeiss.me.
#
# The previous Hugo build is preserved on the `main` branch until cutover.
# When this branch merges to main, Hugo files (themes, layouts, content/posts,
# config, etc.) are deleted in the same commit and this file becomes the
# canonical build configuration.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pagefind index (generated post-build into public/pagefind/) ships as part
# of the static asset bundle. The Netlify Next.js plugin serves /pagefind/*
# from the public/ directory automatically.

# Security headers applied to every route. Netlify also adds HSTS by default
# on custom domains, but we set it explicitly so the source of truth is in
# this file. CSP is intentionally omitted: the post bodies embed YouTube, X,
# Imgur, etc. and authoring becomes painful with a strict policy. We rely on
# X-Content-Type-Options + X-Frame-Options + Referrer-Policy + the platform
# HTTPS to cover the meaningful baseline.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Long cache for hashed assets, short cache for HTML/feeds.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/atom.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/feed.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"
