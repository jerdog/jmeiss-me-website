name: Accessibility

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  content-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run audit-a11y-content
