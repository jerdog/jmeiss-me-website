  blurb: >-
    I help companies build communities, programs, and experiences that
    developers actually like. Almost three decades in tech, the last
    decade-plus in Developer Relations and Developer Experience.
  longBio: >-
    I am a Technical Architect, International Speaker, and DevEx / DevRel
    Leader with over three decades of versatile experience in the tech
    industry — from support, networking, systems, databases, and
    application and website development, to developer relations and
    community engagement. With extensive experience at SMBs and
    enterprise companies like OneStream Software, CircleCI, Auth0, Sprint,
    and Hallmark Cards, I am a committed advocate for open-source software
    and tools, with a deep passion for developer relations, community, and
    their role in improving the developer experience. Beyond my
    professional pursuits, I am a proud father of adults, extremely
    passionate about coffee, travel, hiking, camping, and the mountains,
    and love exploring new technologies.
